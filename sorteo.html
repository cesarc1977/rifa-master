<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rifa Master · Sorteo</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 20%,#153b62,#071321 42%,#030710 85%);color:#fff;font-family:Inter,system-ui,Arial;overflow:hidden}.stage{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px}.brand{position:fixed;top:20px;left:25px;font-size:24px;font-weight:900}.brand b{color:#38bdf8}.live{position:fixed;top:22px;right:25px;background:#450a0a;color:#fecaca;border:1px solid #ef4444;border-radius:99px;padding:7px 12px;font-weight:900}.k{letter-spacing:4px;color:#93c5fd;font-weight:900}h1{font-size:clamp(30px,5vw,68px);margin:8px}.prize{color:#cbd5e1;font-size:clamp(15px,2vw,22px)}.machine{width:min(520px,70vh,82vw);aspect-ratio:1;border-radius:50%;border:8px solid #275a7d;background:radial-gradient(circle,#17446d,#0a1d31 58%,#06101d);display:grid;place-items:center;margin:20px;box-shadow:0 0 70px #38bdf833,inset 0 0 50px #0009;position:relative}.ball{width:45%;aspect-ratio:1;border-radius:50%;background:linear-gradient(145deg,#fff,#cbd5e1);color:#07111f;display:grid;place-items:center;font-size:clamp(54px,9vw,110px);font-weight:1000;opacity:0;transform:scale(.1)}.ball.show{animation:out 1s cubic-bezier(.2,.9,.3,1.2) forwards}@keyframes out{to{opacity:1;transform:scale(1)}}.spin:before,.spin:after{content:"";position:absolute;width:60px;height:60px;border-radius:50%;background:#38bdf8;animation:orb 1s linear infinite}.spin:after{background:#fbbf24;animation-delay:-.5s}@keyframes orb{to{transform:rotate(360deg) translateX(165px) rotate(-360deg)}}.msg{font-size:clamp(20px,3vw,38px);font-weight:900;min-height:48px}.sub{color:#94a3b8;font-size:clamp(13px,1.5vw,18px);max-width:900px;min-height:30px}.controls{position:fixed;bottom:18px;display:flex;gap:9px}button{border:0;border-radius:12px;padding:12px 17px;font:inherit;font-weight:900;cursor:pointer}.primary{background:#38bdf8;color:#03111b}.ghost{background:#13243a;color:#dbeafe;border:1px solid #28435e}.winner .machine{border-color:#fbbf24;box-shadow:0 0 100px #fbbf2466}.winner .ball{background:linear-gradient(145deg,#fde68a,#f59e0b)}.winner .msg{font-size:clamp(38px,6vw,78px);color:#fde68a}.confetti i{position:fixed;top:-20px;width:10px;height:18px;background:#fbbf24;animation:fall 4s linear infinite}.confetti i:nth-child(3n){background:#38bdf8}.confetti i:nth-child(3n+1){background:#34d399}@keyframes fall{to{transform:translateY(110vh) rotate(800deg)}}@media(max-width:600px){.brand{font-size:17px;left:12px}.live{right:12px}.controls{position:static;margin-top:15px}}
</style></head><body><div class="stage" id="stage"><div class="brand">Rifa <b>Master</b></div><div class="live">● SORTEO</div><div class="k">SORTEO OFICIAL</div><h1 id="name">Cargando...</h1><div class="prize" id="prize"></div><div class="machine" id="machine"><div class="ball" id="ball">?</div></div><div class="msg" id="msg">Preparando resultados...</div><div class="sub" id="sub"></div><div class="controls"><button class="primary" id="next" onclick="nextStep()" disabled>Comenzar presentación</button><button class="ghost" onclick="full()">Pantalla completa</button><button class="ghost" onclick="restart()">Repetir</button></div></div><div class="confetti" id="conf"></div><script>
const API='https://rifa-master-api.cesarcarval77.workers.dev',rid=new URLSearchParams(location.search).get('rifa')||'';let d=null,step=-1,busy=false;const $=x=>document.getElementById(x);
async function api(action,...args){let r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,args}),cache:'no-store'}),t=await r.text(),j=JSON.parse(t);if(!j.okApi)throw Error(j.error||'Error');return j.data}
async function init(){try{if(!rid)throw Error('Falta el código de rifa en la URL.');d=await api('obtenerSorteoPublico',rid);$('name').textContent=d.nombre||rid;$('prize').textContent=d.premio?'Premio: '+d.premio:'';if(!d.sorteada){$('msg').textContent='El sorteo aún no ha sido realizado';$('sub').textContent='Cuando el administrador ejecute el sorteo, aquí se podrá presentar el resultado.';return}$('msg').textContent='¡Gracias a todos por participar!';$('sub').textContent='Los dos primeros números quedan descalificados. El tercer número será el ganador.';$('next').disabled=false}catch(e){$('msg').textContent='No se pudo cargar';$('sub').textContent=e.message}}
function reveal(n,m,s,w){busy=true;$('next').disabled=true;$('stage').classList.toggle('winner',!!w);$('ball').classList.remove('show');$('machine').classList.add('spin');$('ball').textContent='?';$('msg').textContent='La tómbola está girando...';$('sub').textContent='';setTimeout(()=>{$('machine').classList.remove('spin');$('ball').textContent=n;$('ball').classList.add('show');$('msg').textContent=m;$('sub').textContent=s;if(w)confetti();busy=false;if(!w){$('next').disabled=false;$('next').textContent='Siguiente extracción'}else $('next').textContent='Presentación finalizada'},1900)}
function nextStep(){if(busy||!d)return;step++;if(step===0)reveal(d.primerNumero,'¡Gracias por participar!','Primer número extraído: queda descalificado. Sigue participando y gracias por confiar en Rifa Master.',false);else if(step===1)reveal(d.segundoNumero,'¡Gracias por ser parte del sorteo!','Segundo número extraído: queda descalificado. Te esperamos en nuestros próximos sorteos.',false);else if(step===2)reveal(d.numeroGanador,'🏆 ¡TENEMOS GANADOR! 🏆','Tercer número extraído · GANADOR OFICIAL · '+(d.premio||''),true)}
function restart(){step=-1;busy=false;$('stage').classList.remove('winner');$('ball').classList.remove('show');$('ball').textContent='?';$('msg').textContent='¡Gracias a todos por participar!';$('sub').textContent='Presiona comenzar para presentar las tres extracciones.';$('next').disabled=!d||!d.sorteada;$('next').textContent='Comenzar presentación';$('conf').innerHTML=''}
function full(){!document.fullscreenElement?document.documentElement.requestFullscreen?.():document.exitFullscreen?.()}
function confetti(){let h='';for(let i=0;i<80;i++)h+=`<i style="left:${Math.random()*100}%;animation-delay:${Math.random()*2}s;animation-duration:${3+Math.random()*3}s"></i>`;$('conf').innerHTML=h}init();
</script></body></html>
